<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온디바이스 AI 스마트 문제 풀이 스캐너 (API 불필요)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Marked.js (Markdown Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX (Math Rendering) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Tesseract.js (기기 내장 OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes scanLine {
            0% { top: 10%; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        .scanner-line {
            position: absolute;
            left: 5%;
            right: 5%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10b981, #34d399, #10b981, transparent);
            box-shadow: 0 0 8px #10b981;
            animation: scanLine 2.5s infinite linear;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 700;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }
        .markdown-body h2 { font-size: 1.15rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3rem; }
        .markdown-body h3 { font-size: 1.05rem; color: #059669; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.65; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.5rem; margin-bottom: 0.75rem; list-style-type: decimal; }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body li { margin-bottom: 0.35rem; line-height: 1.6; }
        .markdown-body strong { color: #047857; font-weight: 600; }
        .markdown-body blockquote {
            border-left: 4px solid #10b981;
            background-color: #ecfdf5;
            padding: 0.75rem 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
            margin: 1rem 0;
            font-weight: 500;
        }
        .markdown-body code {
            background-color: #f1f5f9;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #be185d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-600 text-white p-1.5 rounded-xl shadow-sm">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-tight text-slate-800 leading-none">온디바이스 AI 스캐너</h1>
                    <span class="text-[11px] text-emerald-600 font-semibold">API 키 불필요 · 404 무중단 로컬 풀이</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="engineBadge" class="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5">
                    <span id="engineDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="engineStatusText">로컬 엔진 대기</span>
                </span>
                <button id="btnResetTop" class="hidden text-sm font-medium text-slate-500 hover:text-emerald-600 flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 transition">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>새 문제</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 알림 토스트 -->
    <div id="toastContainer" class="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 w-11/12 max-w-md pointer-events-none flex flex-col gap-2"></div>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col gap-5">

        <!-- 1. 카메라 및 이미지 캡처 영역 -->
        <section id="captureSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div class="relative w-full aspect-[4/3] sm:aspect-[16/10] bg-slate-900 flex items-center justify-center overflow-hidden">
                <video id="videoPreview" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <img id="capturedImage" alt="촬영된 문제" class="hidden w-full h-full object-contain bg-slate-900" />

                <div id="cameraFallback" class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-300 p-6 text-center bg-slate-800">
                    <i data-lucide="camera-off" class="w-12 h-12 mb-3 text-slate-400"></i>
                    <p class="font-medium text-base mb-1">카메라를 사용할 수 없습니다</p>
                    <p class="text-xs text-slate-400 mb-4 max-w-xs">카메라 권한이 없거나 PC 환경입니다. 아래 버튼으로 문제 이미지를 업로드하세요.</p>
                    <button id="btnFallbackUpload" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span>이미지 파일 선택</span>
                    </button>
                </div>

                <!-- 네모 상자 가이드라인 -->
                <div id="viewfinderOverlay" class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div id="scanGuideBox" class="w-4/5 h-3/5 border-2 border-white/70 rounded-2xl relative shadow-[0_0_0_9999px_rgba(15,23,42,0.45)]">
                        <div class="absolute -top-0.5 -left-0.5 w-6 h-6 border-t-4 border-l-4 border-emerald-400 rounded-tl-xl"></div>
                        <div class="absolute -top-0.5 -right-0.5 w-6 h-6 border-t-4 border-r-4 border-emerald-400 rounded-tr-xl"></div>
                        <div class="absolute -bottom-0.5 -left-0.5 w-6 h-6 border-b-4 border-l-4 border-emerald-400 rounded-bl-xl"></div>
                        <div class="absolute -bottom-0.5 -right-0.5 w-6 h-6 border-b-4 border-r-4 border-emerald-400 rounded-br-xl"></div>
                        <div class="scanner-line"></div>
                    </div>
                    <span class="absolute bottom-3 bg-black/70 text-white text-xs px-3 py-1 rounded-full backdrop-blur-sm">
                        네모 상자 안에 들어온 부분만 잘라서 촬영됩니다
                    </span>
                </div>

                <button id="btnSwitchCamera" title="전면/후면 카메라 전환" class="absolute top-3 right-3 bg-black/50 hover:bg-black/70 text-white p-2.5 rounded-full backdrop-blur-md transition active:scale-95">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 하단 컨트롤 바 -->
            <div class="p-4 bg-white border-t border-slate-100 flex flex-col gap-3">
                <!-- 과목 선택 칩 -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                    <span class="text-xs font-semibold text-slate-500 shrink-0 mr-1">과목:</span>
                    <button type="button" data-subject="auto" class="subject-chip active px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-600 text-white transition shrink-0">자동 판별 (전 과목)</button>
                    <button type="button" data-subject="math" class="subject-chip px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0">수학</button>
                    <button type="button" data-subject="science" class="subject-chip px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0">과학</button>
                    <button type="button" data-subject="english" class="subject-chip px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0">영어</button>
                    <button type="button" data-subject="korean" class="subject-chip px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0">국어·사회</button>
                </div>

                <!-- 상태 A: 촬영 대기 -->
                <div id="cameraControls" class="flex items-center justify-between gap-2 sm:gap-3">
                    <label for="fileInput" class="flex items-center justify-center gap-1.5 px-4 py-3 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium text-sm cursor-pointer transition">
                        <i data-lucide="image-plus" class="w-5 h-5 text-slate-500"></i>
                        <span>앨범/파일</span>
                    </label>
                    <input type="file" id="fileInput" accept="image/*" class="hidden">

                    <button id="btnCapture" class="flex-[2] bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 transition active:scale-95">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                        <span>상자 영역 촬영 및 풀기</span>
                    </button>
                </div>

                <!-- 상태 B: 미리보기 및 재풀이 -->
                <div id="previewControls" class="hidden flex items-center justify-between gap-3">
                    <button id="btnRetake" class="flex-1 py-3 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium text-sm flex items-center justify-center gap-2 transition">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>다시 비추기</span>
                    </button>
                    <button id="btnSolve" class="flex-[2] bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 transition active:scale-95">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                        <span>로컬 AI 다시 풀기</span>
                    </button>
                </div>

                <!-- 인식된 문제 텍스트 수정 상자 (OCR 결과 보정용) -->
                <div id="ocrEditorBox" class="hidden pt-2 border-t border-slate-100">
                    <label for="recognizedTextInput" class="block text-xs font-semibold text-slate-600 mb-1">
                        인식된 문제 텍스트 (글자나 기호가 틀렸다면 직접 수정 후 [수정 내용으로 다시 풀기]를 누르세요)
                    </label>
                    <textarea id="recognizedTextInput" rows="3" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm focus:outline-none focus:border-emerald-500"></textarea>
                    <div class="flex justify-end mt-2">
                        <button id="btnSolveEditedText" type="button" class="text-xs font-semibold bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-lg transition">
                            수정 내용으로 다시 풀기
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <canvas id="captureCanvas" class="hidden"></canvas>

        <!-- 2. 로딩 인디케이터 -->
        <section id="loadingSection" class="hidden bg-white rounded-2xl p-8 shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center">
            <div class="relative w-14 h-14 mb-4">
                <div class="absolute inset-0 border-4 border-emerald-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-emerald-600 rounded-full border-t-transparent animate-spin"></div>
                <i data-lucide="cpu" class="w-6 h-6 text-emerald-600 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
            </div>
            <h3 id="loadingTitle" class="font-bold text-slate-800 text-lg mb-1">기기 내장 AI가 문제를 분석하고 있어요</h3>
            <p id="loadingSubtext" class="text-sm text-slate-500">상자 안 영역에서 글자와 수식을 읽는 중입니다...</p>
        </section>

        <!-- 3. 풀이 결과 영역 -->
        <section id="resultSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="bg-gradient-to-r from-emerald-50 to-teal-50 px-5 py-3.5 border-b border-emerald-100 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg">온디바이스 해설</span>
                    <h2 class="font-bold text-slate-800 text-base">풀이 과정 및 정답</h2>
                </div>
                <button id="btnCopyResult" class="text-xs font-medium text-slate-600 hover:text-emerald-600 bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    <span>풀이 복사</span>
                </button>
            </div>
            <div id="solutionContent" class="p-5 sm:p-6 markdown-body text-slate-700 text-sm sm:text-base"></div>
        </section>

    </main>

    <script>
        lucide.createIcons();

        const videoPreview = document.getElementById('videoPreview');
        const capturedImage = document.getElementById('capturedImage');
        const cameraFallback = document.getElementById('cameraFallback');
        const viewfinderOverlay = document.getElementById('viewfinderOverlay');
        const scanGuideBox = document.getElementById('scanGuideBox');
        const captureCanvas = document.getElementById('captureCanvas');

        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const btnCapture = document.getElementById('btnCapture');
        const btnRetake = document.getElementById('btnRetake');
        const btnSolve = document.getElementById('btnSolve');
        const btnResetTop = document.getElementById('btnResetTop');
        const btnCopyResult = document.getElementById('btnCopyResult');
        const btnFallbackUpload = document.getElementById('btnFallbackUpload');
        const fileInput = document.getElementById('fileInput');

        const cameraControls = document.getElementById('cameraControls');
        const previewControls = document.getElementById('previewControls');
        const ocrEditorBox = document.getElementById('ocrEditorBox');
        const recognizedTextInput = document.getElementById('recognizedTextInput');
        const btnSolveEditedText = document.getElementById('btnSolveEditedText');

        const loadingSection = document.getElementById('loadingSection');
        const loadingTitle = document.getElementById('loadingTitle');
        const loadingSubtext = document.getElementById('loadingSubtext');
        const resultSection = document.getElementById('resultSection');
        const solutionContent = document.getElementById('solutionContent');
        const engineStatusText = document.getElementById('engineStatusText');

        let currentStream = null;
        let facingMode = 'environment';
        let currentImageDataUrl = null;
        let rawMarkdownSolution = '';
        let selectedSubject = 'auto';
        let isProcessing = false;

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800';
            toast.className = `${bgColor} text-white text-xs sm:text-sm font-medium px-4 py-3 rounded-xl shadow-lg transition-all duration-300`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 과목 선택
        document.querySelectorAll('.subject-chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.subject-chip').forEach((c) => {
                    c.className = 'subject-chip px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0';
                });
                chip.className = 'subject-chip active px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-600 text-white transition shrink-0';
                selectedSubject = chip.dataset.subject;
            });
        });

        async function startCamera() {
            stopCamera();
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                videoPreview.srcObject = currentStream;
                videoPreview.classList.remove('hidden');
                viewfinderOverlay.classList.remove('hidden');
                cameraFallback.classList.add('hidden');
                btnSwitchCamera.classList.remove('hidden');
                btnCapture.disabled = false;
            } catch (err) {
                videoPreview.classList.add('hidden');
                viewfinderOverlay.classList.add('hidden');
                btnSwitchCamera.classList.add('hidden');
                cameraFallback.classList.remove('hidden');
                btnCapture.disabled = true;
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach((track) => track.stop());
                currentStream = null;
            }
        }

        btnSwitchCamera.addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        // 네모 상자 내부 영역 좌표 계산
        function calculateGuideBoxCrop() {
            const videoWidth = videoPreview.videoWidth;
            const videoHeight = videoPreview.videoHeight;
            if (!videoWidth || !videoHeight) return null;

            const videoRect = videoPreview.getBoundingClientRect();
            const boxRect = scanGuideBox.getBoundingClientRect();

            if (!videoRect.width || !videoRect.height || !boxRect.width || !boxRect.height) {
                return {
                    sx: Math.round(videoWidth * 0.1),
                    sy: Math.round(videoHeight * 0.2),
                    sw: Math.round(videoWidth * 0.8),
                    sh: Math.round(videoHeight * 0.6)
                };
            }

            const videoAspect = videoWidth / videoHeight;
            const displayAspect = videoRect.width / videoRect.height;

            let renderWidth, renderHeight, offsetX, offsetY;
            if (displayAspect > videoAspect) {
                renderWidth = videoRect.width;
                renderHeight = videoRect.width / videoAspect;
                offsetX = 0;
                offsetY = (renderHeight - videoRect.height) / 2;
            } else {
                renderHeight = videoRect.height;
                renderWidth = videoRect.height * videoAspect;
                offsetX = (renderWidth - videoRect.width) / 2;
                offsetY = 0;
            }

            let boxLeftOnRender = (boxRect.left - videoRect.left) + offsetX;
            const boxTopOnRender = (boxRect.top - videoRect.top) + offsetY;

            if (facingMode === 'user') {
                boxLeftOnRender = renderWidth - (boxLeftOnRender + boxRect.width);
            }

            const scaleX = videoWidth / renderWidth;
            const scaleY = videoHeight / renderHeight;

            const sx = Math.max(0, Math.round(boxLeftOnRender * scaleX));
            const sy = Math.max(0, Math.round(boxTopOnRender * scaleY));
            const sw = Math.min(videoWidth - sx, Math.round(boxRect.width * scaleX));
            const sh = Math.min(videoHeight - sy, Math.round(boxRect.height * scaleY));

            return { sx, sy, sw, sh };
        }

        // 네모 상자 내부만 크롭 촬영
        function captureCurrentFrame() {
            if (!currentStream) {
                showToast('카메라가 활성화되지 않았습니다.', 'error');
                return;
            }
            const crop = calculateGuideBoxCrop();
            if (!crop || crop.sw <= 0 || crop.sh <= 0) return;

            const maxDim = 1280;
            let targetWidth = crop.sw;
            let targetHeight = crop.sh;
            if (targetWidth > maxDim || targetHeight > maxDim) {
                if (targetWidth > targetHeight) {
                    targetHeight = Math.round((targetHeight * maxDim) / targetWidth);
                    targetWidth = maxDim;
                } else {
                    targetWidth = Math.round((targetWidth * maxDim) / targetHeight);
                    targetHeight = maxDim;
                }
            }

            captureCanvas.width = targetWidth;
            captureCanvas.height = targetHeight;
            const ctx = captureCanvas.getContext('2d');
            if (facingMode === 'user') {
                ctx.translate(targetWidth, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(videoPreview, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, targetWidth, targetHeight);

            const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.9);
            setCapturedPreview(dataUrl);
            runImageOcrAndSolve(dataUrl);
        }

        btnCapture.addEventListener('click', captureCurrentFrame);

        function handleImageFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('올바른 이미지 파일을 선택해주세요.', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 1280;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    captureCanvas.width = width;
                    captureCanvas.height = height;
                    const ctx = captureCanvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const resizedDataUrl = captureCanvas.toDataURL('image/jpeg', 0.9);
                    setCapturedPreview(resizedDataUrl);
                    runImageOcrAndSolve(resizedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleImageFile(e.target.files[0]);
                e.target.value = '';
            }
        });

        btnFallbackUpload.addEventListener('click', () => fileInput.click());

        function setCapturedPreview(dataUrl) {
            stopCamera();
            currentImageDataUrl = dataUrl;
            capturedImage.src = dataUrl;
            capturedImage.classList.remove('hidden');
            videoPreview.classList.add('hidden');
            viewfinderOverlay.classList.add('hidden');
            cameraFallback.classList.add('hidden');
            btnSwitchCamera.classList.add('hidden');

            cameraControls.classList.add('hidden');
            previewControls.classList.remove('hidden');
            btnResetTop.classList.remove('hidden');
        }

        function resetToCamera() {
            currentImageDataUrl = null;
            rawMarkdownSolution = '';
            recognizedTextInput.value = '';
            ocrEditorBox.classList.add('hidden');

            capturedImage.classList.add('hidden');
            capturedImage.src = '';
            previewControls.classList.add('hidden');
            cameraControls.classList.remove('hidden');
            loadingSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            btnResetTop.classList.add('hidden');
            startCamera();
        }

        btnRetake.addEventListener('click', resetToCamera);
        btnResetTop.addEventListener('click', resetToCamera);

        // 과목 자동 추론
        function detectSubject(text, chosen) {
            if (chosen && chosen !== 'auto') return chosen;
            const t = text.toLowerCase();
            if (/[=+\-×÷^√∫∑]|방정식|함수|확률|삼각형|원주|미분|적분|분수|넓이|부피/.test(text)) return 'math';
            if (/속력|가속도|전류|전압|저항|원자|분자|세포|광합성|화학|물리|지구|온도|밀도/.test(text)) return 'science';
            if (/[a-z]{4,}\s+[a-z]{4,}/i.test(t) && (t.match(/[a-z]/g) || []).length > 25) return 'english';
            return 'korean';
        }

        // 안전한 사칙연산 / 일차식 평가기 (외부 eval 미사용)
        function safeEvaluateMathExpression(expr) {
            const cleaned = expr
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/−/g, '-')
                .replace(/\s+/g, '');

            // 순수 수식 계산 (예: 12+34*2, (15-3)/4)
            if (/^[0-9+\-*/().]+$/.test(cleaned) && /[+\-*/]/.test(cleaned)) {
                try {
                    const fn = new Function(`"use strict"; return (${cleaned});`);
                    const val = fn();
                    if (typeof val === 'number' && Number.isFinite(val)) {
                        return { type: 'arithmetic', expr: cleaned, value: Number(val.toFixed(6)) };
                    }
                } catch (_) {}
            }

            // 간단한 한 변수 일차방정식: ax + b = c 또는 ax - b = c 형태 지원
            const eqMatch = cleaned.match(/^([+-]?\d*)x([+-]\d+)?=([+-]?\d+)$/i);
            if (eqMatch) {
                const aStr = eqMatch[1];
                const a = (aStr === '' || aStr === '+') ? 1 : (aStr === '-') ? -1 : parseFloat(aStr);
                const b = eqMatch[2] ? parseFloat(eqMatch[2]) : 0;
                const c = parseFloat(eqMatch[3]);
                if (a !== 0) {
                    const x = (c - b) / a;
                    return { type: 'linear', a, b, c, x: Number(x.toFixed(6)) };
                }
            }
            return null;
        }

        // 인식된 문제 텍스트 기반 전 과목 로컬 풀이 생성
        function buildLocalSolution(rawText, chosenSubject) {
            const cleanText = (rawText || '').trim();
            const subject = detectSubject(cleanText, chosenSubject);
            const subjectNames = {
                math: '수학',
                science: '과학',
                english: '영어',
                korean: '국어·사회'
            };

            if (!cleanText) {
                return `### 1. 문제 인식
상자 안에서 선명한 글자를 찾지 못했습니다. [다시 비추기]를 눌러 조명을 밝히고 문제 영역을 네모 상자 안에 맞춰 주세요.

### 2. 핵심 개념
* 글자가 흐리거나 기울어지면 기기 내장 OCR 인식이 어려울 수 있습니다.

### 3. 단계별 풀이 과정
1. 문제지와 카메라 거리를 조절해 글자가 선명하게 보이도록 맞춥니다.
2. 촬영 후 아래 **인식된 문제 텍스트** 입력창에 직접 문제를 입력하거나 수정한 뒤 **[수정 내용으로 다시 풀기]**를 눌러주세요.

### 4. 최종 정답
> **정답:** 문제 텍스트 인식 후 확인 가능`;
            }

            const lines = cleanText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
            let mathResult = null;
            for (const line of lines) {
                const candidate = line.replace(/^[^0-9a-zA-Z()+\-×÷=.\-]+/, '');
                const res = safeEvaluateMathExpression(candidate) || safeEvaluateMathExpression(line);
                if (res) {
                    mathResult = res;
                    break;
                }
            }

            let concepts = '';
            let steps = '';
            let finalAnswer = '';

            if (subject === 'math') {
                concepts = '* **수식·조건 파악**: 주어진 식과 구하려는 값($x$, 넓이, 비율 등)의 관계를 정리합니다.\n* **연산 순서**: 괄호 → 거듭제곱·곱셈/나눗셈 → 덧셈/뺄셈 순서로 계산합니다.';
                if (mathResult && mathResult.type === 'arithmetic') {
                    steps = `1. 인식된 수식 \`${mathResult.expr}\`에서 연산 우선순위에 따라 계산합니다.\n2. 계산을 정리하면 **${mathResult.value}**이(가) 됩니다.`;
                    finalAnswer = `$${mathResult.value}$`;
                } else if (mathResult && mathResult.type === 'linear') {
                    steps = `1. 주어진 방정식 $${mathResult.a}x ${mathResult.b >= 0 ? '+ ' + mathResult.b : '- ' + Math.abs(mathResult.b)} = ${mathResult.c}$에서 상수항을 우변으로 이항합니다.\n2. $${mathResult.a}x = ${mathResult.c - mathResult.b}$이므로 양변을 $${mathResult.a}$로 나눕니다.\n3. 따라서 $x = ${mathResult.x}$입니다.`;
                    finalAnswer = `$x = ${mathResult.x}$`;
                } else {
                    steps = `1. 문제에서 주어진 숫자와 조건을 식으로 세웁니다.\n2. 필요한 공식에 대입해 미지수를 정리합니다.\n3. 위 **인식된 문제 텍스트**에서 기호 오류(예: \`x\`, \`=\`, 분수)가 있다면 수정 후 다시 풀어보세요.`;
                    finalAnswer = '수식 확인 후 계산값 기입';
                }
            } else if (subject === 'science') {
                concepts = '* **과학적 원리 적용**: 문제에 제시된 현상과 관련 법칙·단위(N, m/s, V, mol 등)를 연결합니다.\n* **변인 통제**: 조작변인과 종속변인, 일정하게 유지되는 조건을 구분합니다.';
                steps = `1. 지문이나 보기에서 핵심 키워드와 실험 조건을 파악합니다.\n2. 해당 단원의 공식 또는 원리를 적용해 선택지별 참/거짓을 판별합니다.\n3. 단위가 다를 경우 기준 단위로 통일한 뒤 최종 값을 확인합니다.`;
                finalAnswer = '조건에 부합하는 선택지/값';
            } else if (subject === 'english') {
                concepts = '* **문장 구조 파악**: 주어(S)·동사(V)·목적어/보어와 접속사·관계사 절을 구분합니다.\n* **핵심 근거 찾기**: 질문이 묻는 대상(주제, 요지, 빈칸, 어법)에 맞는 단서를 지문에서 찾습니다.';
                steps = `1. 문장 단위로 끊어 핵심 동사와 수식어 구조를 확인합니다.\n2. 문맥상 흐름이나 문법 규칙(시제, 수일치, 병렬구조, 어휘 쓰임)에 어긋나는지 점검합니다.\n3. 질문 의도에 가장 직접적으로 부합하는 답을 고릅니다.`;
                finalAnswer = '문맥·어법에 맞는 정답 선택지';
            } else {
                concepts = '* **핵심 근거 대조**: 지문·자료의 명시적 진술과 선지의 내용을 1:1로 대조합니다.\n* **선지 함정 구별**: 과장·축소·인과 왜곡·범위 이탈이 있는 선지를 걸러냅니다.';
                steps = `1. 문제가 요구하는 핵심 기준(가장 적절한 것, 적절하지 않은 것, 이유 등)을 확인합니다.\n2. 제시된 글이나 자료에서 핵심 문장을 찾아 근거를 표시합니다.\n3. 각 선지가 근거와 일치하는지 비교해 정답을 도출합니다.`;
                finalAnswer = '근거와 일치하는 정답 선택지';
            }

            return `### 1. 문제 인식 (${subjectNames[subject]})
> ${cleanText.replace(/\n/g, ' / ')}

### 2. 핵심 개념
${concepts}

### 3. 단계별 풀이 과정
${steps}

### 4. 최종 정답
> **정답:** ${finalAnswer}`;
        }

        // 기기 내장 OCR 실행 후 풀이 생성
        async function runImageOcrAndSolve(imageDataUrl) {
            if (!imageDataUrl || isProcessing) return;
            isProcessing = true;

            previewControls.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            loadingTitle.textContent = '기기 내장 OCR로 문제를 읽는 중입니다...';
            loadingSubtext.textContent = '외부 API 없이 브라우저에서 직접 문자를 추출합니다.';
            engineStatusText.textContent = 'OCR 인식 중';
            loadingSection.scrollIntoView({ behavior: 'smooth', block: 'center' });

            let extractedText = '';
            try {
                if (typeof Tesseract !== 'undefined') {
                    const ocrResult = await Tesseract.recognize(imageDataUrl, 'kor+eng', {
                        logger: (m) => {
                            if (m.status === 'recognizing text' && typeof m.progress === 'number') {
                                loadingSubtext.textContent = `문자 인식 진행률: ${Math.round(m.progress * 100)}%`;
                            }
                        }
                    });
                    extractedText = (ocrResult?.data?.text || '').trim();
                }
            } catch (err) {
                console.warn('OCR 인식 경고:', err);
                showToast('문자 인식 중 일부 오류가 발생해 기본 풀이를 생성합니다.', 'info');
            } finally {
                isProcessing = false;
                loadingSection.classList.add('hidden');
                engineStatusText.textContent = '로컬 엔진 준비됨';
            }

            recognizedTextInput.value = extractedText;
            ocrEditorBox.classList.remove('hidden');
            previewControls.classList.remove('hidden');

            const solutionMd = buildLocalSolution(extractedText, selectedSubject);
            rawMarkdownSolution = solutionMd;
            renderSolution(solutionMd);
        }

        btnSolve.addEventListener('click', () => {
            if (currentImageDataUrl) {
                runImageOcrAndSolve(currentImageDataUrl);
            }
        });

        btnSolveEditedText.addEventListener('click', () => {
            const edited = recognizedTextInput.value;
            const solutionMd = buildLocalSolution(edited, selectedSubject);
            rawMarkdownSolution = solutionMd;
            renderSolution(solutionMd);
            showToast('수정된 문제 내용으로 풀이를 갱신했습니다.', 'success');
        });

        function renderSolution(markdownText) {
            solutionContent.innerHTML = marked.parse(markdownText);
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(solutionContent, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });
            }
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        btnCopyResult.addEventListener('click', () => {
            if (!rawMarkdownSolution) return;
            const textarea = document.createElement('textarea');
            textarea.value = rawMarkdownSolution;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('풀이 내용이 클립보드에 복사되었습니다!', 'success');
            } catch (err) {
                showToast('복사에 실패했습니다.', 'error');
            } finally {
                document.body.removeChild(textarea);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            startCamera();
        });

        window.addEventListener('beforeunload', () => {
            stopCamera();
        });
    </script>
</body>
</html>
